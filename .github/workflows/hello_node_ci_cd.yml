name: Hello Node App to AWS EKS

on:
    push:
    workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'


            - name: Install Dependencies
              working-directory: docker/app1-hello/node
              run: npm ci

            - name: Run tests (If any)
              working-directory: docker/app1-hello/node
              run: npm test --if-present


    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                context: ./docker/app1-hello/node
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/hello-node:latest
    deploy-aws-eks:
      runs-on: ubuntu-latest
      needs: docker-build-push

      steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name hello_cluster --region us-east-1

      - name: Verify connection
        run: kubectl get nodes

      - name: Deploy to AWS
        run: kubectl apply -f k8s/aws/app1-hellonode

      
      
              